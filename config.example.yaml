discovery:
  max_steps: 30
  max_duration_seconds: 300
  max_consecutive_no_progress: 3
execution:
  action_timeout_seconds: 10
  max_recovery_attempts: 2
  # Optional bounded OpenRouter single-step recovery when replay hits UI drift.
  # Keep false for pure model-free replay; set true to allow one assist step per run.
  assisted_fallback: false
  assisted_fallback_max_per_run: 1
handoff:
  timeout_seconds: 900
evidence:
  directory: ./runs
  retention_days: 7
headless: false
scenario: normal
